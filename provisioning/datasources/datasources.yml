apiVersion: 1

datasources:
  - name: Cloudflare
    type: ricoberger-cloudflare-datasource
    uid: cloudflare
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      # Must be "apiToken" or "apiKey"
      authMethod: apiToken
      apiEmail: ${CF_API_EMAIL}
      zones:
      account: ${CF_ACCOUNT_ID}
    secureJsonData:
      apiKey: ${CF_API_KEY}
      apiToken: ${CF_API_TOKEN}
